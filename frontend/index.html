      margin-bottom: 0.5em;
      line-height: 1.6;
    }

    .markdown-body strong {
      font-weight: 600;
      color: #1e293b;
    }

    .dark .markdown-body strong {
      color: #f8fafc;
    }

    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3 {
      font-weight: 600;
      margin-top: 1.5em;
      margin-bottom: 0.75em;
      color: #0f172a;

    .dark .markdown-body h1,
    .dark .markdown-body h2,

      color: #e2e8f0;
    }

    .markdown-body pre {

      padding: 1em;
      border-radius: 0.5em;
      overflow-x: auto;
      margin-bottom: 1em;
      border: 1px solid #e2e8f0;
    }

    .dark .markdown-body pre {
      background-color: #0f172a;
      border-color: #334155;
    }
